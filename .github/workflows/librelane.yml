name: RTL to GDSII - LibreLane

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  librelane:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreLane
        run: python -m pip install librelane==3.0.16

      - name: Check Docker
        run: docker --version

      - name: Run LibreLane
        run: |
          python -m librelane --dockerized --container-no-tty \
          --pdk-root "$HOME/.ciel" \
          lab0_counter/librelane/config.json
          
      - name: Upload physical design results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-4bit-librelane-results
          path: |
            lab0_counter/librelane/runs/
          if-no-files-found: warn
          retention-days: 14
