name: RTL to GDSII - LibreLane

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  librelane:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-cache.fossi-foundation.org
            extra-trusted-public-keys = nix-cache.fossi-foundation.org:3+K59iFwXqKsL7BNu6Guy0v+uTlwsxYQxjspXzqLYQs=
            extra-experimental-features = nix-command flakes

      - name: Run LibreLane
        run: |
          nix run github:librelane/librelane/3.0.16 -- \
            --pdk-root "$HOME/.ciel" \
            lab0_counter/librelane/config.json

      - name: Upload physical design results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counter-4bit-librelane-results
          path: |
            lab0_counter/librelane/runs/
            designs/counter_4bit/runs/
          if-no-files-found: warn
          retention-days: 14
